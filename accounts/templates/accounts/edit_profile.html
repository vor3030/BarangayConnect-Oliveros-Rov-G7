{% extends 'accounts/base.html' %}
{% block title %}Edit profile | Barangay Connect{% endblock %}
{% block content %}
<section class="card form-card">
  <h1>Edit profile</h1>
  <p class="muted">If you change your email, use the new address the next time you sign in.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="actions">
      <button class="button" type="submit">Save changes</button>
      <a href="{% url 'profile' %}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
