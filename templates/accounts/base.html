{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Barangay Connect{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'accounts/theme.css' %}">
  <link rel="stylesheet" href="{% static 'accounts/site.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="{% url 'dashboard' %}">Barangay<span>Connect</span></a>
      <nav aria-label="Main navigation">
        {% if user.is_authenticated %}
          <a href="{% url 'dashboard' %}">Dashboard</a>
          <a href="{% url 'profile' %}">Profile</a>
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="nav-button" type="submit">Sign out</button>
          </form>
        {% else %}
          <a href="{% url 'login' %}">Sign in</a>
          <a href="{% url 'register' %}">Register</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main class="shell">
    {% for message in messages %}
      <p class="notice" role="status">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
