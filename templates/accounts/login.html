{% extends 'accounts/auth_layout.html' %}
{% block title %}Sign in | Barangay Connect{% endblock %}
{% block auth_form %}
<h1>Sign in</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}

  <button class="button" type="submit">Sign in</button>
</form>
<p>New resident? <a href="{% url 'register' %}">Create an account</a></p>
{% endblock %}
